services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiLocations\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiLocations\Indexer\LocationIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  dashboard.widget.maiLocationsManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_locations/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiLocationsManual'
        groupNames: 'documentation'
        title: 'Handbuch: Standorte'
        description: 'Kurze Anleitung für Orte und Öffnungszeiten.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
